# Vidicon
TrailDecay="Trail Decay"
TrailDecayTooltip="Perceptual tube-persistence time. 0.50 is short but visible, 0.80 is natural, 0.90-0.99 spans progressively long trails, and 1.00 holds the trail indefinitely."
LumaThreshold="Luma Threshold"
LumaThresholdTooltip="Brightness needed to excite the persistence signal. Around 0.65-0.80 keeps trails on highlights; lower values include more midtones."
TrailColor="Trail Color"
TrailColorTooltip="Tint color for trails. White preserves original colors, other colors create stylized effects."
ColorMix="Color Mix"
ColorMixTooltip="With Source Color enabled, blends the sampled trail hue toward Trail Color. 0 = source color, 1 = selected tint."
SourceColor="Source Color"
SourceColorTooltip="When enabled, trails start from the sampled source hue and Color Mix can tint them. Disable to force the selected Trail Color."
RedLag="Red Phosphor Lag"
RedLagTooltip="Simulates early color tubes where red decays slower than blue/green, causing red ghosting on bright objects."
CometTail="Comet Tailing"
CometTailTooltip="Adds a horizontal smear to trails, simulating scanline lag on intensely bright moving objects."
TubeNoise="Tube Noise"
TubeNoiseTooltip="Adds static/snow specifically within the trailing areas."
BlueLag="Blue Phosphor Lag"
BlueLagTooltip="Simulates blue channel persistence differences. Higher = blue trails linger longer, adding color separation to motion."
BeamPull="Beam Pull"
BeamPullTooltip="Simulates electron beam discharge lag: bright highlights smear horizontally as the beam struggles to discharge the target. Higher = more trailing on bright objects."
LagNonlinear="Lag Non-Linearity"
LagNonlinearTooltip="Brightness-dependent decay: brighter areas discharge the target faster, reducing persistence. Higher = bright objects trail less than dark ones."
ScanLines="Scan Lines"
ScanLinesTooltip="Visible alternating scan line rows, characteristic of tube-based cameras and CRT displays."
VidGamma="Tube Gamma"
VidGammaTooltip="Simulates the transfer curve of tube cameras. Lower = lifted shadows and compressed highlights (classic tube look, ~0.7). Higher = more contrast."
Halation="Halation Glow"
HalationTooltip="Adds a spread/bloom around bright highlights, simulating light scattering within the vidicon tube faceplate. A defining CCTV artifact."
HumBar="Hum Bar"
HumBarTooltip="Simulates power supply ripple: a subtle horizontal brightness band that drifts vertically. Adds analog instability characteristic of tube cameras."
RegisterOffset="Registration Offset"
RegisterOffsetTooltip="Per-channel RGB misalignment in pixels. Simulates the three-tube prism block not being perfectly aligned. Higher = more color fringing on motion."
RegisterDrift="Registration Drift"
RegisterDriftTooltip="How fast the RGB registration drifts over time, simulating thermal and magnetic instability in three-tube cameras."

